name: build

# Кожен push у main збирає Teka і публікує реліз з інсталятором Teka-win-Setup.exe.
# Встановлені копії Teka самі підтягують оновлення з релізів (Velopack, як у Lumos).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      REPO_URL: https://github.com/${{ github.repository }}
      VERSION: 0.2.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: >
          dotnet publish Teka.csproj -c Release -r win-x64 --self-contained true
          -p:DebugType=none -p:Version=${{ env.VERSION }} -o publish

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Download previous release (for small delta updates)
        continue-on-error: true
        run: vpk download github --repoUrl ${{ env.REPO_URL }} --token ${{ github.token }}

      - name: Pack installer
        run: >
          vpk pack --packId Teka --packVersion ${{ env.VERSION }} --packDir publish
          --mainExe Teka.exe --packTitle Teka --icon Assets/teka.ico

      - name: Create GitHub release
        run: >
          vpk upload github --outputDir Releases --repoUrl ${{ env.REPO_URL }} --token ${{ github.token }}
          --publish --releaseName "Teka ${{ env.VERSION }}" --tag v${{ env.VERSION }}

      - uses: actions/upload-artifact@v4
        with:
          name: Teka-Setup-${{ env.VERSION }}
          path: Releases/*Setup.exe
